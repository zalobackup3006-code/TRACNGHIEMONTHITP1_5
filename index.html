<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Tiếng Anh Tương Tác</title>
    <!-- Sử dụng Font chữ Nunito bo tròn, nét đậm cực kỳ dễ đọc cho trẻ em -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ================= BIẾN MÀU SẮC & UI ================= */
        :root {
            --primary: #4e54c8;
            --primary-light: #8f94fb;
            --secondary: #ff9f43;
            --success: #1dd1a1;
            --danger: #ff6b6b;
            --bg-body: #f1f2f6;
            --bg-card: #ffffff;
            --text-dark: #2f3542;
            --text-muted: #747d8c;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* ================= KHUNG ỨNG DỤNG CHÍNH ================= */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            display: none; /* Ẩn đi chờ kích hoạt */
            flex-direction: column;
            min-height: 80vh;
        }
        .active-screen { display: flex; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= MÀN HÌNH KHỞI ĐẦU ================= */
        #welcome-screen { padding: 50px 20px; text-align: center; justify-content: center; align-items: center; }
        .mascot { font-size: 80px; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        #welcome-screen h1 { font-size: 2.5rem; color: var(--primary); font-weight: 900; margin-bottom: 10px; }
        #welcome-screen p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; font-weight: 700; }
        
        .name-input {
            width: 100%; max-width: 400px; padding: 18px 20px; font-size: 1.3rem; font-weight: 800;
            border: 4px solid #dfe4ea; border-radius: 15px; text-align: center; color: var(--primary);
            outline: none; transition: 0.3s; margin-bottom: 25px;
        }
        .name-input:focus { border-color: var(--secondary); box-shadow: 0 0 15px rgba(255, 159, 67, 0.3); }

        .btn {
            padding: 16px 35px; font-size: 1.3rem; font-weight: 900; border: none; border-radius: 15px;
            cursor: pointer; transition: all 0.2s; color: #fff; text-transform: uppercase;
        }
        .btn-start { background: var(--secondary); box-shadow: 0 8px 0 #d35400; }
        .btn-start:hover { transform: translateY(4px); box-shadow: 0 4px 0 #d35400; }
        .btn-submit { background: var(--primary); box-shadow: 0 8px 0 #373b8e; margin-top: 20px; width: 100%; max-width: 300px; }
        .btn-submit:hover { transform: translateY(4px); box-shadow: 0 4px 0 #373b8e; }

        /* ================= MÀN HÌNH BÀI TẬP ================= */
        .app-header {
            background: #f1f2f6; padding: 15px 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 3px solid #dfe4ea; flex-wrap: wrap; gap: 15px;
        }
        .student-badge { font-weight: 800; font-size: 1.1rem; color: var(--primary); background: #dfe4ea; padding: 8px 15px; border-radius: 10px; }
        
        .progress-box { flex-grow: 1; max-width: 350px; text-align: center; }
        .progress-text { font-weight: 800; font-size: 1rem; color: var(--text-dark); margin-bottom: 5px; }
        .progress-bar-bg { background: #dfe4ea; height: 12px; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        .nav-dropdown {
            padding: 10px; font-size: 1rem; font-weight: 800; border: 3px solid var(--primary);
            border-radius: 10px; outline: none; cursor: pointer; color: var(--text-dark);
        }

        .question-area { padding: 30px 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .task-label {
            display: inline-block; background: #ffeaa7; color: #d63031; padding: 8px 15px;
            border-radius: 10px; font-weight: 900; font-size: 1.1rem; margin-bottom: 15px; align-self: flex-start;
        }
        .question-text { font-size: 1.6rem; font-weight: 900; color: var(--text-dark); line-height: 1.5; margin-bottom: 25px; }

        /* Dạng bài Trắc nghiệm (MCQ) */
        .mcq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .mcq-opt {
            background: #ffffff; border: 3px solid #ced6e0; padding: 20px 15px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 800; color: var(--text-dark); cursor: pointer;
            text-align: left; transition: 0.2s;
        }
        .mcq-opt:hover { border-color: var(--primary-light); background: #f8f9fa; }
        .mcq-opt.selected { border-color: var(--primary); background: #e0e7ff; box-shadow: 0 4px 15px rgba(78, 84, 200, 0.2); }

        /* Dạng bài Sắp xếp từ (Reorder) - Touch Friendly */
        .reorder-container { display: flex; flex-direction: column; gap: 20px; }
        .reorder-zone {
            background: #f1f2f6; min-height: 80px; border: 3px dashed #a4b0be; border-radius: 15px;
            padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .word-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .word-chip {
            background: var(--bg-card); border: 2px solid var(--primary); color: var(--primary);
            padding: 12px 18px; font-size: 1.3rem; font-weight: 800; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 0 var(--primary); transition: 0.1s; user-select: none;
        }
        .word-chip:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary); }

        .action-area { padding: 20px; text-align: center; border-top: 2px solid #f1f2f6; }

        /* ================= POPUP PHẢN HỒI ================= */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(3px);
        }
        .popup {
            background: #fff; width: 90%; max-width: 450px; border-radius: 25px; padding: 30px;
            text-align: center; animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .popup-icon { font-size: 4.5rem; margin-bottom: 10px; }
        .popup-title { font-size: 2rem; font-weight: 900; margin-bottom: 15px; }
        .popup-desc {
            font-size: 1.15rem; font-weight: 700; color: #57606f; line-height: 1.5;
            background: #f1f2f6; padding: 15px; border-radius: 15px; margin-bottom: 25px; text-align: left;
        }
        
        .popup.correct { border: 6px solid var(--success); }
        .popup.correct .popup-title { color: var(--success); }
        .popup.incorrect { border: 6px solid var(--danger); }
        .popup.incorrect .popup-title { color: var(--danger); }
        
        .btn-popup { padding: 14px 30px; font-size: 1.2rem; background: var(--text-dark); box-shadow: 0 6px 0 #1e272e; width: 100%; }
        .btn-popup:hover { transform: translateY(4px); box-shadow: 0 2px 0 #1e272e; }

        /* ================= MÀN HÌNH BÁO CÁO ================= */
        #report-screen { padding: 30px; text-align: center; }
        #report-screen h2 { color: var(--primary); font-size: 2.2rem; font-weight: 900; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #f1f2f6; padding: 20px 10px; border-radius: 15px; }
        .stat-card h3 { font-size: 2.5rem; font-weight: 900; margin-bottom: 5px; }
        .stat-card p { font-size: 1rem; font-weight: 800; color: var(--text-muted); }
        
        .table-wrapper { overflow-x: auto; max-height: 400px; border-radius: 15px; border: 2px solid #dfe4ea; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--primary); color: #fff; padding: 15px; position: sticky; top: 0; font-weight: 800; font-size: 1.1rem;}
        td { padding: 15px; border-bottom: 1px solid #dfe4ea; font-size: 1.1rem; font-weight: 600; color: var(--text-dark); }
        tr:nth-child(even) { background: #f8f9fa; }

        @media (max-width: 600px) {
            .mcq-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.3rem; }
            .app-header { flex-direction: column; }
            .progress-box { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH KHỞI ĐẦU -->
    <div class="app-container active-screen" id="welcome-screen">
        <div class="mascot">🦉</div>
        <h1>Đấu Trường Tiếng Anh</h1>
        <p>Thử thách bản thân qua 5 Đề Thi. Hoàn thành để nhận bảng điểm nhé!</p>
        <input type="text" id="studentName" class="name-input" placeholder="Nhập tên của em vào đây..." autocomplete="off">
        <button class="btn btn-start" onclick="startApp()">VÀO THI NGAY!</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div class="app-container" id="quiz-screen">
        <div class="app-header">
            <div class="student-badge">👤 <span id="display-name"></span></div>
            <div class="progress-box">
                <div class="progress-text">Tiến độ: <span id="progress-text-val">0/0</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
            </div>
            <select class="nav-dropdown" id="question-nav" onchange="jumpToQuestion()"></select>
        </div>

        <div class="question-area">
            <div class="task-label" id="q-task">SAMPLE X - Task Y</div>
            <div class="question-text" id="q-text">Nội dung câu hỏi sẽ hiển thị ở đây.</div>
            <div id="interactive-zone">
                <!-- Nút MCQ hoặc khối chữ Reorder render tại đây -->
            </div>
        </div>

        <div class="action-area">
            <button class="btn btn-submit" id="btn-check" onclick="checkAnswer()">KIỂM TRA 🎯</button>
            <button class="btn btn-start" id="btn-report" style="display:none; width:100%; max-width: 300px;" onclick="showReport()">XEM BẢNG ĐIỂM 📊</button>
        </div>
    </div>

    <!-- MÀN HÌNH BÁO CÁO -->
    <div class="app-container" id="report-screen">
        <h2>BÁO CÁO KẾT QUẢ</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <h3 style="color: var(--primary);" id="stat-total">0</h3>
                <p>Tổng số câu</p>
            </div>
            <div class="stat-card">
                <h3 style="color: var(--success);" id="stat-perfect">0</h3>
                <p>Đúng ngay lần 1</p>
            </div>
            <div class="stat-card">
                <h3 style="color: var(--danger);" id="stat-redo">0</h3>
                <p>Cần xem lại</p>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Câu hỏi</th><th>Đáp án sai của em</th><th>Đáp án chuẩn</th></tr></thead>
                <tbody id="report-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- POPUP OVERLAY -->
    <div class="overlay" id="popup-overlay">
        <div class="popup" id="popup-card">
            <div class="popup-icon" id="popup-icon">✅</div>
            <div class="popup-title" id="popup-title">Chính xác!</div>
            <div class="popup-desc" id="popup-desc">Giải thích...</div>
            <button class="btn btn-popup" onclick="closePopup()">Tiếp tục ⏭️</button>
        </div>
    </div>

<script>
/**
 * DỮ LIỆU CÂU HỎI (Đã gỡ bỏ toàn bộ dấu chấm, phẩy, hỏi chấm gây nhiễu + Cấp đủ từ bị thiếu)
 */
const rawData = [
    // ================== BÀI TẬP SỐ 1 ==================
    [1, "Task 1. Odd one out.", "mcq", "A. city B. town C. flat D. province", "C", "Flat (căn hộ) chỉ nơi ở cụ thể, các từ còn lại chỉ đơn vị hành chính/khu vực.", "A. city|B. town|C. flat|D. province"],
    [1, "Task 1. Odd one out.", "mcq", "A. house B. far C. near D. modern", "A", "House là Danh từ, các từ còn lại là Tính từ.", "A. house|B. far|C. near|D. modern"],
    [1, "Task 1. Odd one out.", "mcq", "A. small B. quiet C. noisy D. like", "D", "Like là Động từ, các từ còn lại là Tính từ miêu tả.", "A. small|B. quiet|C. noisy|D. like"],
    [1, "Task 1. Odd one out.", "mcq", "A. can B. jump C. skip D. dance", "A", "Can là Động từ khuyết thiếu, còn lại là Động từ hành động thể chất.", "A. can|B. jump|C. skip|D. dance"],
    [1, "Task 1. Odd one out.", "mcq", "A. exciting B. boring C. relaxed D. tiring", "C", "Relaxed là tính từ đuôi -ed (chỉ cảm xúc), còn lại là đuôi -ing (chỉ tính chất sự vật).", "A. exciting|B. boring|C. relaxed|D. tiring"],
    [1, "Task 1. Odd one out.", "mcq", "A. geography B. country C. history D. ethics", "B", "Country (đất nước) không phải là môn học, còn lại là tên các môn học.", "A. geography|B. country|C. history|D. ethics"],
    [1, "Task 2. Pronunciation.", "mcq", "A. windy B. sunny C. fly D. rainy", "C", "Chữ 'y' trong fly đọc là /aɪ/, còn lại đọc là /i/.", "A. windy|B. sunny|C. fly|D. rainy"],
    [1, "Task 2. Pronunciation.", "mcq", "A. weather B. cream C. health D. headache", "B", "Chữ 'ea' trong cream đọc là /i:/, còn lại đọc là /e/.", "A. weather|B. cream|C. health|D. headache"],
    [1, "Task 2. Pronunciation.", "mcq", "A. mouth B. cloud C. about D. your", "D", "Chữ 'ou' trong your đọc là /ɔ:/, còn lại đọc là /aʊ/.", "A. mouth|B. cloud|C. about|D. your"],
    [1, "Task 2. Pronunciation.", "mcq", "A. cold B. hot C. sore D. body", "C", "Chữ 'o' trong sore đọc là /ɔ:/, khác với các từ còn lại.", "A. cold|B. hot|C. sore|D. body"],
    [1, "Task 2. Pronunciation.", "mcq", "A. small B. sorry C. sure D. sometimes", "C", "Chữ 's' trong sure đọc là /ʃ/ (s nặng), còn lại là /s/ (s nhẹ).", "A. small|B. sorry|C. sure|D. sometimes"],
    [1, "Task 3. Choose the best option.", "mcq", "Hanoi is a big ______ in the north.", "C", "Hà Nội là một thành phố (city).", "A. street|B. town|C. city|D. lane"],
    [1, "Task 3. Choose the best option.", "mcq", "His ______ is 187B, Giang Vo Street.", "D", "Có số nhà và tên đường -> Đây là địa chỉ (address).", "A. class|B. road|C. town|D. address"],
    [1, "Task 3. Choose the best option.", "mcq", "______ your favourite subject?", "C", "Cấu trúc hỏi: What is -> Viết tắt là What's.", "A. Which|B. What|C. What’s|D. Who"],
    [1, "Task 3. Choose the best option.", "mcq", "What subject is he ______ now? - Vietnamese.", "C", "Có 'now' -> Hiện tại tiếp diễn: is + V-ing (learning).", "A. to learn|B. learn|C. learning|D. learned"],
    [1, "Task 3. Choose the best option.", "mcq", "Linda: Who do you live ______? Mai: I live ______ my parents.", "C", "Sống cùng với ai dùng giới từ 'with'.", "A. in - in|B. for - for|C. with - with|D. at - at"],
    [1, "Task 3. Choose the best option.", "mcq", "______ your friend like Vietnamese? Yes, she does.", "D", "Chủ ngữ 'your friend' số ít -> Mượn trợ động từ 'Does'.", "A. am|B. is|C. do|D. does"],
    [1, "Task 3. Choose the best option.", "mcq", "I like math because I like ______.", "A", "Môn Toán liên quan đến việc giải quyết bài toán (solving problems).", "A. solving problems|B. doing experiments|C. making things|D. reading stories"],
    [1, "Task 3. Choose the best option.", "mcq", "My father watches TV every day at 7 p.m. He ______ watches TV at 7 p.m.", "A", "Ngày nào cũng làm (every day) -> Tần suất 100% (always).", "A. always|B. usually|C. often|D. sometimes"],
    // Sửa lỗi Reorder: Gỡ dấu chấm phẩy, kiểm tra đủ từ
    [1, "Task 4. Put the words in correct order.", "reorder", "they/ do/ subjects/ Which/ like/ IT/ like/ They/ and/ Science", "Which subjects do they like They like IT and Science", "Câu hỏi: Từ để hỏi + trợ động từ + S + V?. Trả lời: S + V + O.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "exercise/ usually/ they/ get/ do/ morning/ up/ early/ and", "They usually get up early and do morning exercise", "Trạng từ chỉ tần suất (usually) đứng trước động từ thường (get up).", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "small/ quiet/ village/ and/ It/ is/ a", "It is a small and quiet village", "S + be + a/an + adj + and + adj + N.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "because/ He/ English/ likes/ he/ likes/ languages/ learning", "He likes English because he likes learning languages", "Dùng 'because' nối 2 mệnh đề nguyên nhân - kết quả.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "often/ we/ at/ stay/ and/ school/ homework/ do/ our/ afternoon/ the/ in", "We often stay at school and do our homework in the afternoon", "Cụm thời gian (in the afternoon) đứng cuối câu.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "cooks/ sometimes/ goes/ she/ shopping/ and/ school/ dinner/ after", "She sometimes goes shopping and cooks dinner after school", "Liệt kê hành động: goes shopping and cooks dinner.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "use/ They/ computers/ never/ PE/ in/ class", "They never use computers in PE class", "PE class là lớp Thể dục. Trạng ngữ nơi chốn đứng cuối.", ""],
    [1, "Task 4. Put the words in correct order.", "reorder", "English/ at/ My/ class/ four/ to/ a/ starts/ quarter", "My English class starts at a quarter to four", "Cấu trúc giờ: a quarter to + số giờ (giờ kém 15).", ""],

    // ================== BÀI TẬP SỐ 2 ==================
    [2, "Task 1. Odd one out.", "mcq", "A. holiday B. teachers C. children D. subjects", "A", "Holiday (kỳ nghỉ) không liên quan tới trường lớp như các từ còn lại.", "A. holiday|B. teachers|C. children|D. subjects"],
    [2, "Task 1. Odd one out.", "mcq", "A. January B. April C. November D. month", "D", "Month là từ chung (tháng), còn lại là tên tháng cụ thể.", "A. January|B. April|C. November|D. month"],
    [2, "Task 1. Odd one out.", "mcq", "A. subject B. holiday C. experiment D. exciting", "D", "Exciting là tính từ, các từ còn lại là danh từ.", "A. subject|B. holiday|C. experiment|D. exciting"],
    [2, "Task 1. Odd one out.", "mcq", "A. her B. his C. they D. their", "C", "They là Đại từ nhân xưng, còn lại là Tính từ sở hữu.", "A. her|B. his|C. they|D. their"],
    [2, "Task 1. Odd one out.", "mcq", "A. clock B. wardrobe C. picture D. eight", "D", "Eight là số đếm, còn lại là đồ vật.", "A. clock|B. wardrobe|C. picture|D. eight"],
    [2, "Task 1. Odd one out.", "mcq", "A. solving B. problems C. using D. learning", "B", "Problems là danh từ số nhiều, còn lại là V-ing.", "A. solving|B. problems|C. using|D. learning"],
    [2, "Task 1. Odd one out.", "mcq", "A. crowded B. country C. noisy D. modern", "B", "Country là danh từ, còn lại là tính từ.", "A. crowded|B. country|C. noisy|D. modern"],
    [2, "Task 1. Odd one out.", "mcq", "A. pretty B. bad C. nine D. beautiful", "C", "Nine là số đếm, còn lại là tính từ.", "A. pretty|B. bad|C. nine|D. beautiful"],
    [2, "Task 2. Pronunciation.", "mcq", "A. see B. where C. never D. get", "A", "Chữ 'ee' trong see đọc là /i:/, còn lại đọc là /e/.", "A. see|B. where|C. never|D. get"],
    [2, "Task 2. Pronunciation.", "mcq", "A. trip B. did C. with D. nice", "D", "Chữ 'i' trong nice đọc là /aɪ/, còn lại là /ɪ/.", "A. trip|B. did|C. with|D. nice"],

    [5, "Task 4. Put the words in correct order.", "reorder", "do/ do/ What/ the/ weekend/ you/ at", "What do you do at the weekend", "Cụm thời gian 'at the weekend' đứng cuối câu hỏi.", ""]

/* ================= TRẠNG THÁI ỨNG DỤNG LÕI ================= */
let questionBank = [];
let currentIndex = 0;
let userProgress = {
    total: rawData.length,
    status: new Array(rawData.length).fill(false),
    tries: new Array(rawData.length).fill(0),
    mistakes: new Array(rawData.length).fill(null).map(() => [])
};
let reorderState = { pool: [], answer: [] };

/* ================= KHỞI ĐỘNG ỨNG DỤNG ================= */
function startApp() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (nameInput === "") {
        alert("Em nhớ nhập tên của mình để bắt đầu nhé!");
        return;
    }
    
    // Khởi tạo mảng Object chuẩn từ rawData
    questionBank = rawData.map((d, index) => {
        // Tự động loại bỏ MỌI DẤU CHẤM/PHẨY/HỎI CHẤM ra khỏi câu hỏi để làm sạch dữ liệu
        let cleanText = d[3].replace(/[.,?!]/g, '');
        let cleanCorrect = d[4].replace(/[.,?!]/g, '');
        let cleanOptions = d[6] ? d[6].split('|') : [];

        return {
            id: index,
            sampleNum: d[0],
            taskTitle: d[1],
            qType: d[2],
            qText: cleanText,
            correctAns: cleanCorrect,
            explainText: d[5],
            options: cleanOptions
        }
    });

    document.getElementById('display-name').innerText = nameInput;
    document.getElementById('welcome-screen').classList.remove('active-screen');
    document.getElementById('quiz-screen').classList.add('active-screen');

    initDropdownMenu();
    loadQuestion(0);
}

function initDropdownMenu() {
    const select = document.getElementById('question-nav');
    select.innerHTML = '';
    questionBank.forEach((q, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `Câu ${idx + 1} (Đề ${q.sampleNum})`;
        select.appendChild(opt);
    });
}

/* ================= HIỂN THỊ CÂU HỎI ================= */
function loadQuestion(index) {
    currentIndex = index;
    const q = questionBank[index];
    
    document.getElementById('q-task').innerText = `ĐỀ ${q.sampleNum} - ${q.taskTitle}`;
    
    // Nếu là câu trắc nghiệm, vẫn in text bình thường. Nếu là reorder, in text hướng dẫn.
    document.getElementById('q-text').innerText = q.qType === 'reorder' ? "Chạm vào các từ màu xanh để ghép thành câu hoàn chỉnh:" : q.qText;
    
    const interactZone = document.getElementById('interactive-zone');
    interactZone.innerHTML = '';

    if (q.qType === 'mcq') {
        const grid = document.createElement('div');
        grid.className = 'mcq-grid';
        q.options.forEach(optText => {
            let btn = document.createElement('button');
            btn.className = 'mcq-opt';
            // Không gỡ dấu chấm ở phần A. B. C. D. để giữ format cho đẹp
            btn.innerText = optText; 
            btn.onclick = () => selectMCQ(btn);
            grid.appendChild(btn);
        });
        interactZone.appendChild(grid);
    } else if (q.qType === 'reorder') {
        // Tách câu bằng các khoảng trắng hoặc dấu gạch chéo
        let words = q.qText.split(/[\/\s]+/).filter(w => w.trim().length > 0);
        reorderState.pool = words;
        reorderState.answer = [];
        
        const wrapper = document.createElement('div');
        wrapper.className = 'reorder-container';
        
        const ansZone = document.createElement('div');
        ansZone.className = 'reorder-zone';
        ansZone.id = 'reorder-ans-zone';
        
        const poolZone = document.createElement('div');
        poolZone.className = 'word-pool';
        poolZone.id = 'reorder-pool-zone';

        wrapper.appendChild(ansZone);
        wrapper.appendChild(poolZone);
        interactZone.appendChild(wrapper);
        
        renderWordChips();
    }

    // Ẩn/Hiện nút Submit
    document.getElementById('btn-check').style.display = userProgress.status[index] ? 'none' : 'inline-block';
    syncUI();
}

function selectMCQ(btn) {
    document.querySelectorAll('.mcq-opt').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function renderWordChips() {
    const poolZone = document.getElementById('reorder-pool-zone');
    const ansZone = document.getElementById('reorder-ans-zone');
    poolZone.innerHTML = ''; ansZone.innerHTML = '';

    reorderState.answer.forEach((word, idx) => {
        let chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerText = word;
        chip.onclick = () => {
            reorderState.pool.push(word);
            reorderState.answer.splice(idx, 1);
            renderWordChips();
        };
        ansZone.appendChild(chip);
    });

    reorderState.pool.forEach((word, idx) => {
        let chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerText = word;
        chip.onclick = () => {
            reorderState.answer.push(word);
            reorderState.pool.splice(idx, 1);
            renderWordChips();
        };
        poolZone.appendChild(chip);
    });
}

/* ================= XỬ LÝ ĐÁP ÁN ================= */
function checkAnswer() {
    const q = questionBank[currentIndex];
    let userAnswer = "";

    if (q.qType === 'mcq') {
        const selected = document.querySelector('.mcq-opt.selected');
        if (!selected) { alert("Em hãy click chọn 1 đáp án trước khi Kiểm tra nhé!"); return; }
        // Lấy ký tự A, B, C, D
        userAnswer = selected.innerText.split('.')[0].trim();
    } else if (q.qType === 'reorder') {
        if (reorderState.pool.length > 0) { alert("Em phải xếp hết các từ vào khung xám bên trên nhé!"); return; }
        userAnswer = reorderState.answer.join(' ');
    }

    userProgress.tries[currentIndex]++;
    
    // Loose matching: Chỉ lấy các ký tự là CHỮ và SỐ để so sánh (không quan tâm khoảng trắng, viết hoa hay dấu câu)
    let isCorrect = false;
    if(q.qType === 'mcq') {
        isCorrect = userAnswer.toUpperCase() === q.correctAns.toUpperCase();
    } else {
        let cleanUser = userAnswer.toLowerCase().replace(/[^a-z0-9]/g, '');
        let cleanCorrect = q.correctAns.toLowerCase().replace(/[^a-z0-9]/g, '');
        isCorrect = cleanUser === cleanCorrect;
    }

    if (isCorrect) {
        userProgress.status[currentIndex] = true;
        syncUI();
        showFeedbackPopup(true, "Giải thích: " + q.explainText);
    } else {
        userProgress.mistakes[currentIndex].push(userAnswer);
        let errorMsg = `<b>Gợi ý & Lý thuyết:</b><br>${q.explainText}<br><br><i>Em hãy đọc kỹ lại và sửa lỗi nhé!</i>`;
        showFeedbackPopup(false, errorMsg);
    }
}

function syncUI() {
    const correctCount = userProgress.status.filter(Boolean).length;
    document.getElementById('progress-text-val').innerText = `${correctCount}/${userProgress.total}`;
    document.getElementById('progress-bar').style.width = `${(correctCount / userProgress.total) * 100}%`;

    const select = document.getElementById('question-nav');
    select.options[currentIndex].innerText = userProgress.status[currentIndex] 
        ? `Câu ${currentIndex + 1} (Đề ${questionBank[currentIndex].sampleNum}) ✅` 
        : `Câu ${currentIndex + 1} (Đề ${questionBank[currentIndex].sampleNum})`;
    select.value = currentIndex;

    if (correctCount === userProgress.total) {
        document.getElementById('btn-check').style.display = 'none';
        document.getElementById('btn-report').style.display = 'inline-block';
    }
}

function jumpToQuestion() {
    loadQuestion(parseInt(document.getElementById('question-nav').value));
}

/* ================= POPUP HỆ THỐNG ================= */
function showFeedbackPopup(isSuccess, msgHtml) {
    const overlay = document.getElementById('popup-overlay');
    const card = document.getElementById('popup-card');
    
    overlay.style.display = 'flex';
    if (isSuccess) {
        card.className = 'popup popup-correct';
        document.getElementById('popup-icon').innerText = '🎉';
        document.getElementById('popup-title').innerText = 'Chính xác tuyệt đối!';
    } else {
        card.className = 'popup popup-incorrect';
        document.getElementById('popup-icon').innerText = '💡';
        document.getElementById('popup-title').innerText = 'Khoan đã...';
    }
    document.getElementById('popup-desc').innerHTML = msgHtml;
}

function closePopup() {
    document.getElementById('popup-overlay').style.display = 'none';
    if (userProgress.status[currentIndex]) {
        // Tự động tìm câu chưa làm tiếp theo
        let nextIdx = userProgress.status.indexOf(false);
        if (nextIdx !== -1) loadQuestion(nextIdx);
        else showReport();
    }
}

/* ================= XUẤT BẢNG BÁO CÁO ================= */
function showReport() {
    document.getElementById('quiz-screen').classList.remove('active-screen');
    document.getElementById('report-screen').classList.add('active-screen');

    let perfectHits = 0;
    let redoCount = 0;
    const tbody = document.getElementById('report-tbody');
    tbody.innerHTML = '';

    questionBank.forEach((q, idx) => {
        if (userProgress.tries[idx] === 1 && userProgress.status[idx]) perfectHits++;
        if (userProgress.mistakes[idx].length > 0) {
            redoCount++;
            let tr = document.createElement('tr');
            let shortQuestion = q.qText.length > 40 ? q.qText.substring(0,40)+"..." : q.qText;
            if (q.qType === 'reorder') shortQuestion = "Sắp xếp câu: " + shortQuestion;

            let lastWrong = userProgress.mistakes[idx][userProgress.mistakes[idx].length - 1];
            
            tr.innerHTML = `
                <td><b>Câu ${idx+1}:</b> ${shortQuestion}</td>
                <td style="color: var(--danger); font-weight:800;">${lastWrong}</td>
                <td style="color: var(--success); font-weight:800;">${q.correctAns}</td>
            `;
            tbody.appendChild(tr);
        }
    });

    document.getElementById('stat-total').innerText = userProgress.total;
    document.getElementById('stat-perfect').innerText = perfectHits;
    document.getElementById('stat-redo').innerText = redoCount;
}
</script>
